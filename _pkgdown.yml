url: https://hms-dbmi.github.io/pic-sure-r-adapter-hpds/

template:
  bootstrap: 5

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
  components:
    articles:
      text: Articles
      menu:
        - text: Getting started
          href: articles/getting-started.html
        - text: Search and facets
          href: articles/search-and-facets.html
        - text: Building queries
          href: articles/building-queries.html
        - text: Running and exporting
          href: articles/running-and-exporting.html
        - text: Migrating from v1
          href: articles/migrating-from-v1.html

reference:
  - title: Connection
    contents: [connect, platforms]
  - title: Search
    contents: [searchDictionary, facets, addFacet, removeFacet]
  - title: Query construction
    contents: [createClause, buildClauseGroup]
  - title: Query execution
    contents: [runQuery, runQueryByID, loadQueryByID]
  - title: Export
    contents: [exportAsPFB, exportCSV, exportTSV]
  - title: Errors
    contents: [picsureError]
  - title: Enums
    desc: >
      Public enum constants mirroring the Python adapter's enums. Pass
      a member to the wrapper functions instead of a string for
      autocomplete and parity with the Python API.
    contents:
      - ClauseType
      - GroupOperator
      - QueryType
      - Platform
