name: Integration tests

on:
  schedule:
    - cron: '13 6 * * *'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      PICSURE_INTEGRATION: "1"
      PICSURE_TEST_PLATFORM: ${{ secrets.PICSURE_TEST_PLATFORM }}
      PICSURE_TEST_TOKEN: ${{ secrets.PICSURE_TEST_TOKEN }}
      PICSURE_TEST_REQUIRE_PATH: ${{ secrets.PICSURE_TEST_REQUIRE_PATH }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          needs: check

      - name: Run integration tests
        run: Rscript -e "devtools::test()"

      - name: Open an issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title: `Nightly integration run failed (${today})`,
              body:  `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['integration-failure']
            });
